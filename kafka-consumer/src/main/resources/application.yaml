server.port: 9091

database:
  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 0
    timeout: 10000
  redisson:
    host: redis://127.0.0.1:6379
    timeout: 10000
    password: 123456
  mongo:
    uri: mongodb://root:123456@localhost:27017/kotlin-bank?authSource=admin

kafka:
  info:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: my-consumer-group
      auto-offset-reset: earliest
      auto-commit: false
  topics:
    transactions:
      pollingInterval: 1000
      concurrency: 3
      maxPollRecords: 500
      enabled: true

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.common.network.Selector: ERROR
    org.apache.kafka.clients.consumer: WARN
    org.apache.kafka.clients.Metadata: WARN
    org.example.consumer.ConsumerFactory: INFO